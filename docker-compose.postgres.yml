# Standalone Compose file running karmabot on PostgreSQL 18 (SQLite
# storage is not used; no /data volume). Database credentials can be
# changed via POSTGRES_* variables in .env.
name: karmabot-postgres

services:
  karmabot:
    image: ghcr.io/zam-zam/mattermost-karmabot:latest
    # Used by `docker compose -f docker-compose.postgres.yml up --build`;
    # a plain `up` prefers the image.
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      KARMABOT_DB_DRIVER: postgres
      KARMABOT_DB_DSN: postgres://karmabot:${POSTGRES_PASSWORD:-karmabot}@postgres:5432/karmabot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karmabot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karmabot}
      POSTGRES_DB: karmabot
    volumes:
      # PG 18 wants the mount at /var/lib/postgresql (not the data
      # subdirectory) so pg_upgrade --link stays within one mount point.
      - karmabot-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karmabot -d karmabot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  karmabot-postgres:
